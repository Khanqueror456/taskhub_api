name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub
          POSTGRES_DB: taskhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taskhub:taskhub@localhost:5432/taskhub
      TEST_DATABASE_URL: postgresql://taskhub:taskhub@localhost:5432/taskhub_test
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef012345678
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, type-check (code and tests), unit and integration tests, build
        run: npm run ci
      - name: Coverage thresholds
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  docker:
    name: Build image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }} # pull requests only prove the image builds
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test the containers
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create .env (CI-only secrets)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://taskhub:taskhub@localhost:5432/taskhub
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=ci-only-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET=ci-only-refresh-secret-0123456789abcdef012345678
          EOF
      - name: Start the stack
        run: docker compose --profile app up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 3
          done
          docker compose --profile app logs
          exit 1
      - name: Docs are served
        run: curl -sf http://localhost:3000/openapi.json | head -c 200
      - name: Register a user
        run: |
          curl -sf -X POST http://localhost:3000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery","name":"CI"}' | grep accessToken
      - name: The worker delivered the welcome email
        run: |
          for i in $(seq 1 20); do
            if curl -s http://localhost:8025/api/v1/messages | grep -Eq '"total": *[1-9]'; then echo "email received"; exit 0; fi
            sleep 3
          done
          docker compose --profile app logs worker
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v