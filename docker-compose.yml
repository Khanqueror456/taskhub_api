x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://taskhub:taskhub@postgres:5432/taskhub
  REDIS_URL: redis://redis:6379
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  APP_URL: http://localhost:3000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub
      POSTGRES_DB: taskhub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  # ---- the application, started with: docker compose --profile app up --build ----
  migrate:
    profiles: ["app"]
    build: .
    image: taskhub-api:local
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build: .
    image: taskhub-api:local
    init: true
    ports: ["3000:3000"]
    env_file: .env # secrets such as the JWT keys come from here
    environment: *app-env # inside Docker the hosts are service names, not localhost
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    image: taskhub-api:local
    init: true
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: *app-env
    healthcheck:
      disable: true # the image's health check probes the HTTP port, which the worker doesn't have
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata: